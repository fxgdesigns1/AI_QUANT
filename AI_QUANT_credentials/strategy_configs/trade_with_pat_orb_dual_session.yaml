## 0) Non‑Negotiable Contract
- **LOCKDOWN:** System is locked down; **only strategy configs** are tweakable.
- **OANDA‑ONLY execution path:** No mock/sim broker. Paper uses **OANDA Practice**.
- **ALL news/econ inputs wired + validated:** Providers must be enabled via config and validated at startup (fail-fast).
- **Fail‑fast startup:** Missing required keys/services => service must not become healthy.
- **Deterministic operation:** Single source of secrets at runtime (Secret Manager loader at service start).
- **No script sprawl:** No one-off scripts. Extend/refactor in place.
- **Sandbox-only scratch:** Any temporary Cursor output must go ONLY in `sandbox/_cursor_scratch/` (gitignored).

